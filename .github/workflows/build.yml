name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/bundle.sh

      - name: Zip app
        run: cd build && ditto -c -k --keepParent LookFar.app LookFar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LookFar
          path: build/LookFar.zip
